name: ci
on:
#  schedule:
#    - cron: "0 0 * * *"
  push:
    branches:
      - master
      - main
      - ci_release
    tags:
      - "v*"
      - "test-ci*"
  pull_request:

permissions:
  contents: read

jobs:
  plugin-ci:
    uses: mattermost/actions-workflows/.github/workflows/plugin-ci.yml@main
    secrets: inherit
    with:
      golang-version: 1.23
      golangci-lint-version: v1.64.8

  release:
    runs-on: ubuntu-latest
    needs: plugin-ci
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/release-notes.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/org.ebuildy.plugin-minotor-0.1.0.tar.gz
